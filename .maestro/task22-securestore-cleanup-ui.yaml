appId: host.exp.Exponent
---
- stopApp

- openLink: "exp://127.0.0.1:8081/--/maestro-task22-securestore"

- extendedWaitUntil:
    visible: "TASK-22 SecureStore Cleanup"
    timeout: 60000

- tapOn:
    id: "task22-run-securestore-cleanup"

- extendedWaitUntil:
    visible: "SecureStore cleanup passed"
    timeout: 10000

- assertNotVisible: "SecureStore cleanup failed"
