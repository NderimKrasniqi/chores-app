appId: host.exp.Exponent
---
- stopApp

- openLink: "exp://127.0.0.1:8081/--/maestro-task12"

- extendedWaitUntil:
    visible: "TASK-12 Maestro Fixture"
    timeout: 60000

- tapOn: "Reset TASK-12 fixture"

- assertVisible: "Claim Garage shelves"
- assertVisible: "Claim Clean windows"

- tapOn: "Claim Garage shelves"

- assertVisible: "You claimed this"

- assertVisible:
    id: "claimable-submit-maestro-task12-garage-claim"

- scrollUntilVisible:
    element:
      text: "Clean windows"
    direction: DOWN
    timeout: 10000

- assertVisible: "Clean windows"
- assertVisible: "Finish your current claimed chore before claiming another."

- scrollUntilVisible:
    element:
      id: "claimable-submit-maestro-task12-garage-claim"
    direction: UP
    timeout: 10000

- tapOn:
    id: "claimable-submit-maestro-task12-garage-claim"

- assertVisible: "Status: Waiting for parent approval"
- assertVisible: "Waiting for parent approval"

- scrollUntilVisible:
    element:
      text: "Clean windows"
    direction: DOWN
    timeout: 10000

- assertVisible: "Clean windows"
- assertVisible: "Finish your current claimed chore before claiming another."

- assertNotVisible: "Unclaim Garage shelves"

- assertNotVisible:
    id: "claimable-submit-maestro-task12-garage-claim"
